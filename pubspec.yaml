name: app
description: MY TUS - kisisel TUS calisma planlama ve odak takip uygulamasi
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Turkce tarih secici ve sistem yazilari icin (Flutter'in kendi paketi, ek surum riski yok).
  flutter_localizations:
    sdk: flutter
  # Bolum notlarina fotograflar eklemek icin resmi Flutter paketi.
  image_picker: ^1.1.2
  # Kullanici girisi ve bulut veri esitlemesi icin resmi Firebase paketleri.
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
