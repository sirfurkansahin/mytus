# MY TUS Web Mobil (PWA) Canlı Dağıtımı ve Testleri
# Her gönderimde veya elle tetiklendiğinde: kod analizi + birim/widget/uçtan uca testler + Flutter Web derlemesi.
# Sonuç doğrudan GitHub Pages (https://sirfurkansahin.github.io/mytus/) üzerine yayınlanır.
name: Web Mobil (PWA) Dağıt

on:
  push:
    branches:
      - main
      - 'model2/*'
      - 'claude/*'
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: Flutter sürümünü göster
        run: flutter --version

      - name: Bağımlılıkları indir
        run: flutter pub get

      - name: Kod analizi
        run: flutter analyze

      - name: Testler
        run: flutter test --reporter expanded

      - name: Flutter Web derle (GitHub Pages alt yolu /mytus/)
        run: >
          flutter build web --release --base-href "/mytus/"
          --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
          --dart-define=FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }}
          --dart-define=FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          --dart-define=FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}

      - name: GitHub Pages için artefakt yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages'e dağıt
        id: deployment
        uses: actions/deploy-pages@v4
