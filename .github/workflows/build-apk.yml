# Her gonderimde: analiz + test + APK derleme. APK, calisma sayfasindan "Artifacts" altindan indirilir.
# android/ klasoru yoksa bu akis hicbir sey yapmadan basarili biter.
# Imza sirlari (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD) varsa kalici anahtarla imzalar, yoksa debug anahtariyla.
# Firebase sirlari (FIREBASE_APP_ID, FIREBASE_SERVICE_ACCOUNT, FIREBASE_TESTERS) varsa APK'yi
# main dalina gonderimde veya elle "Run workflow > dagit" secildiginde Firebase App Distribution'a yukler.
name: APK derle

on:
  push:
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      dagit:
        description: "APK'yi Firebase App Distribution'a da yukle"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Durumu belirle
        id: check
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FB_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FB_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FB_TESTERS: ${{ secrets.FIREBASE_TESTERS }}
        run: |
          if [ -d android ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else
            echo "android/ klasoru yok; derleme atlandi."; echo "ready=false" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASS" ]; then echo "sign=true" >> "$GITHUB_OUTPUT"; else
            echo "Imza sirlari yok: debug anahtariyla imzalanacak."; echo "sign=false" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$FB_APP_ID" ] && [ -n "$FB_SA" ] && [ -n "$FB_TESTERS" ]; then echo "fb=true" >> "$GITHUB_OUTPUT"; else
            echo "Firebase sirlari eksik: yukleme yapilmayacak."; echo "fb=false" >> "$GITHUB_OUTPUT"; fi

      - name: Imza anahtarini hazirla
        if: steps.check.outputs.ready == 'true' && steps.check.outputs.sign == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mytus-upload.jks"
          echo "MYTUS_KEYSTORE_PATH=$RUNNER_TEMP/mytus-upload.jks" >> "$GITHUB_ENV"
          echo "MYTUS_KEYSTORE_PASSWORD=$KEYSTORE_PASS" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        if: steps.check.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        if: steps.check.outputs.ready == 'true'
        with:
          # Surum sabit: derleme her gun ayni sonucu versin (3.47.7 ile test edildi).
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: Flutter surumunu goster
        if: steps.check.outputs.ready == 'true'
        run: |
          flutter --version
          echo "::notice title=Flutter surumu::$(flutter --version | head -1)"

      - name: Bagimliliklari indir
        if: steps.check.outputs.ready == 'true'
        run: flutter pub get

      - name: Kod analizi
        if: steps.check.outputs.ready == 'true'
        run: |
          set +e
          flutter analyze > analiz.txt 2>&1
          kod=$?
          cat analiz.txt
          if [ $kod -ne 0 ]; then
            # Gunluk indirilemedigi icin hatalari tek bir ozet bildirimine yaz.
            ozet=$(grep -E "^ *(error|warning|info) " analiz.txt | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Analiz hatalari::${ozet}"
          fi
          exit $kod

      - name: Testler
        if: steps.check.outputs.ready == 'true'
        run: |
          set +e
          : > test.txt
          genel=0
          for dosya in test/*_test.dart; do
            echo "== $dosya" | tee -a test.txt
            timeout 240 flutter test --reporter expanded "$dosya" >> test.txt 2>&1
            kod=$?
            if [ $kod -eq 124 ]; then
              echo "ZAMAN ASIMI (takildi): $dosya" | tee -a test.txt
              echo "SON SATIRLAR:" >> test.txt
              genel=1
            elif [ $kod -ne 0 ]; then
              genel=1
            fi
          done
          tail -80 test.txt
          if [ $genel -ne 0 ]; then
            ozet=$(grep -vE "^\s*$|✅" test.txt | grep -E "^==|ZAMAN|[0-9]+:[0-9]+ \+[0-9]+|❌|Expected|Actual|EXCEPTION|overflow|OVERFLOW|Which|tests? (passed|failed)|_test.dart:[0-9]+" | sed 's/[═╞╡]/=/g' | head -70 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Test hatalari::${ozet}"
          fi
          exit $genel

      - name: Release APK derle
        if: steps.check.outputs.ready == 'true'
        run: |
          set +e
          flutter build apk --release --build-number=${{ github.run_number }} > derleme.txt 2>&1
          kod=$?
          tail -60 derleme.txt
          if [ $kod -ne 0 ]; then
            ozet=$(grep -vE "^\s*$" derleme.txt | grep -iE "error|fail|wrong|exception|what went|e: |warning:.*(deprecat)" | head -30 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Derleme hatalari::${ozet}"
          fi
          exit $kod

      - name: Imza dogrulamasi (sertifika parmak izi)
        if: steps.check.outputs.ready == 'true'
        continue-on-error: true
        run: |
          OUT=$(keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk 2>&1 | grep -E "Owner|SHA256" | head -4 | tr '\n' ' ')
          echo "::notice title=APK imzasi::${OUT}"

      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.ready == 'true'
        with:
          name: mytus-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Firebase App Distribution'a yukle
        if: steps.check.outputs.ready == 'true' && steps.check.outputs.fb == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.dagit))
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          testers: ${{ secrets.FIREBASE_TESTERS }}
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: ${{ github.event.head_commit.message || format('Elle baslatilan derleme - {0}', github.ref_name) }}
