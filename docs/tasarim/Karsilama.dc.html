<div style="width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:#FBFAFE;color:#1D1A2B;font-family:'Figtree',system-ui,sans-serif;overflow:hidden;padding:40px 20px 24px;gap:20px">

  <div>

    <h1 style="margin:16px 0 6px;font-size:30px;font-weight:800;letter-spacing:-0.5px;line-height:1.15">Çalışma planını kuralım</h1>
    <p style="margin:0;font-size:15px;line-height:1.45;color:#5F5A74">İki şey yeterli: sınav tarihin ve çalışacağın dersler. Hepsini sonra Ayarlar'dan değiştirebilirsin.</p>
  </div>

  <div>
    <label for="tarih" style="display:block;font-size:14px;font-weight:700;margin-bottom:8px">Sınav tarihi</label>
    <input id="tarih" type="date" style="width:100%;box-sizing:border-box;min-height:52px;border:1px solid #CFC8E8;border-radius:14px;background:#FFFFFF;padding:0 16px;font-family:inherit;font-size:16px;color:#1D1A2B">

  </div>

        <label style="display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:20px;background:#E9E3FB;color:#3F2A9A;font-size:14px;font-weight:600"><input type="checkbox" checked style="accent-color:#5B3EC8;margin:0">Anatomi</label>
        <label style="display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:20px;background:#E9E3FB;color:#3F2A9A;font-size:14px;font-weight:600"><input type="checkbox" checked style="accent-color:#5B3EC8;margin:0">Histoloji ve Embriyoloji</label>
        <label style="display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:20px;background:#E9E3FB;color:#3F2A9A;font-size:14px;font-weight:600"><input type="checkbox" checked style="accent-color:#5B3EC8;margin:0">Fizyoloji</label>
        <label style="display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:20px;background:#E9E3FB;color:#3F2A9A;font-size:14px;font-weight:600"><input type="checkbox" checked style="accent-color:#5B3EC8;margin:0">Biyokimya</label>
        <label style="display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:20px;background:#E9E3FB;color:#3F2A9A;font-size:14px;font-weight:600"><input type="checkbox" checked style="accent-color:#5B3EC8;margin:0">Mikrobiyoloji</label>
        <label style="display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:20px;background:#E9E3FB;color:#3F2A9A;font-size:14px;font-weight:600"><input type="checkbox" checked style="accent-color:#5B3EC8;margin:0">Patoloji</label>
        <label style="display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:20px;background:#E9E3FB;color:#3F2A9A;font-size:14px;font-weight:600"><input type="checkbox" checked style="accent-color:#5B3EC8;margin:0">Farmakoloji</label>
      </div>
    </div>
    <div>
      <div style="font-size:12px;font-weight:700;color:#5F5A74;letter-spacing:0.6px;margin-bottom:8px">KLİNİK</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        <label style="display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:20px;background:#DDF1EC;color:#0B5A4C;font-size:14px;font-weight:600"><input type="checkbox" checked style="accent-color:#0F766E;margin:0">Dahiliye</label>
        <label style="display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:20px;background:#DDF1EC;color:#0B5A4C;font-size:14px;font-weight:600"><input type="checkbox" checked style="accent-color:#0F766E;margin:0">Pediatri</label>

        <label style="display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:20px;background:#DDF1EC;color:#0B5A4C;font-size:14px;font-weight:600"><input type="checkbox" checked style="accent-color:#0F766E;margin:0">Kadın Hastalıkları ve Doğum</label>

  <div style="flex-grow:1"></div>

  <a href="Main.dc.html" style="display:flex;align-items:center;justify-content:center;background:#5B3EC8;color:#FFFFFF;border-radius:16px;min-height:52px;font-size:16px;font-weight:700">Başla</a>
